name = "emotion-tracker-bot"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Two crons (Cloudflare's day-of-week field is 1-7 with 7=Sunday, unlike standard unix cron's 0-7):
#  1) every 10 min inside the daytime window (02:00-16:50 UTC = 07:00-21:50 Asia/Almaty)
#     -> checks whether it's time to send today's question
#  2) Sunday 15:00 UTC = 20:00 Asia/Almaty -> sends the weekly markdown digest
[triggers]
crons = ["*/10 2-16 * * *", "0 15 * * 7"]

[[kv_namespaces]]
binding = "EMOTIONS_KV"
id = "52b85a98704a43dc825ec4a7b48081ae"

[vars]
# Asia/Almaty is UTC+5 year-round (no DST)
TZ_OFFSET_MINUTES = "300"
WINDOW_START_HOUR = "7"
WINDOW_END_HOUR = "22"
